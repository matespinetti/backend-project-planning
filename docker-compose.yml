version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: projectplanning_postgres
    environment:
      POSTGRES_USER: projectplanning
      POSTGRES_PASSWORD: projectplanning123
      POSTGRES_DB: projectplanning
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectplanning"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - projectplanning_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projectplanning_api
    environment:
      DATABASE_URL: postgresql://projectplanning:projectplanning123@postgres:5432/projectplanning
      BONITA_URL: http://bonita:8080/bonita
      BONITA_USERNAME: walter.bates
      BONITA_PASSWORD: bpm
      BONITA_PROCESS_NAME: ProjectPlanning
      BONITA_PROCESS_VERSION: "1.0"
      API_V1_PREFIX: /api/v1
      PROJECT_NAME: ProjectPlanning API
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - projectplanning_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  projectplanning_network:
    driver: bridge
