version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projectplanning_proxy_api
    environment:
      # Cloud Persistence API (update with your actual cloud URL)
      CLOUD_API_URL: https://your-cloud-api.example.com
      CLOUD_API_TIMEOUT: 30
      # Bonita BPM
      BONITA_URL: http://bonita:8080/bonita
      BONITA_USERNAME: walter.bates
      BONITA_PASSWORD: bpm
      BONITA_PROCESS_NAME: ProjectPlanning
      BONITA_PROCESS_VERSION: "1.0"
      # API Settings
      API_V1_PREFIX: /api/v1
      PROJECT_NAME: ProjectPlanning Proxy API
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
    ports:
      - "8000:8000"
    networks:
      - projectplanning_network
    restart: unless-stopped

networks:
  projectplanning_network:
    driver: bridge
